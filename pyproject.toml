[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rosclaw-know"
version = "1.0.0"
description = "Physical-AI knowledge compiler — turns multi-source corpus + execution feedback into procedural engineering experience for ROSClaw agents."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ROSClaw Team", email = "team@rosclaw.io"},
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "httpx>=0.27"]
# Compiler-side ingestion / harvesting / graph weaving — NOT needed by the
# rosclaw runtime, which only consumes catalog assets + sim_ingest envelopes.
compiler = [
    "aiohttp>=3.9",
    "tqdm>=4.66",
    "networkx>=3.2",
    "sentence-transformers>=2.7",
]
# Full stack convenience.
all = [
    "rosclaw-know[dev,api,compiler]",
]

[project.urls]
Homepage = "https://rosclaw.io"
Repository = "https://github.com/ros-claw/rosclaw-know"
Documentation = "https://docs.rosclaw.io"
"Bug Tracker" = "https://github.com/ros-claw/rosclaw-know/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rosclaw_know"]

[tool.hatch.build.targets.wheel.force-include]
"data/assets" = "rosclaw_know/data/assets"
"data/curated_registry" = "rosclaw_know/data/curated_registry"

[tool.hatch.build.targets.sdist]
ignore-vcs = true
only-include = [
    "/src",
    "/data/assets",
    "/data/curated_registry",
    "/tests",
    "/scripts",
    "/README.md",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
