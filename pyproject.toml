[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rosclaw-know"
version = "0.1.0"
description = "Offline knowledge refinery — converts declarative wiki pages into procedural heuristics for ROSClaw agents."
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "networkx>=3.2",
    "sentence-transformers>=2.7",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
