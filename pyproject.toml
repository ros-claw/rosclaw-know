[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rosclaw-know"
version = "1.5.0a1"
description = "Physical-AI knowledge compiler — turns multi-source corpus + execution feedback into procedural engineering experience for ROSClaw agents."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "httpx>=0.27"]
# Compiler-side ingestion / harvesting / graph weaving — NOT needed by the
# rosclaw runtime, which only consumes catalog assets + sim_ingest envelopes.
compiler = [
    "aiohttp>=3.9",
    "tqdm>=4.66",
    "networkx>=3.2",
    "sentence-transformers>=2.7",
]
# Full stack convenience.
all = [
    "rosclaw-know[dev,api,compiler]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
