controller_manager:
  ros__parameters:
    update_rate: 250
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
      joints:
        - shoulder_pan_joint
        - shoulder_lift_joint
        - elbow_joint
        - wrist_1_joint
        - wrist_2_joint
        - wrist_3_joint
    velocity_controller:
      type: velocity_controllers/JointGroupVelocityController
      joints:
        - shoulder_pan_joint

joint_limits:
  shoulder_pan_joint:
    max_position: 3.14159
    max_velocity: 2.5    # tighter than URDF (3.15) for safety
    max_effort: 100.0    # tighter than URDF (150.0) for safety
  wrist_1_joint:
    max_velocity: 2.0
    max_effort: 20.0
