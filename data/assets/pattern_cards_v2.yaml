    or a sibling task's) rather than starting from a random or hand-tuned baseline.
  diagnosis: Top entries seed their optimiser from a prior-best solution (their own
    or a sibling task's) rather than starting from a random or hand-tuned baseline.  Cuts
    the path-length to a high score significantly.
  preconditions:
