  next_experiment: '- Seed the optimiser from a prior-best solution: seeded optimizer
    from a prior-best solution.'
  code_target: The whole editable artifact is the patch site.
  patch_sketch: '```python

    # Warm-start from a prior-best solution on the SAME task.

    # DO NOT embed concrete tuning values from another task''s archive.

    initial = load_prior_best_for_this_task()

    optimiser = make_optimizer(initial=initial)

    ```'
  expected_verifier_signals:
