    description: added output clamp on T_cmd
    target_identifier: T_cmd
    score_delta: null
    schema_version: '2.0'
  failed_mutations: []
  expected_verifier_signal: feasibility stays valid even on aggressive maneuvers; thrust / torque never exceeds its bound.
  contraindications:
  - clamps must be applied *before* the actuator-lag filter, not after, or the command will spike at the next sample
