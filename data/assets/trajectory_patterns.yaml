- id: candidate_warm_start_from_prior_best
  task_family: unknown_optimization
  failure_id: null
  diagnosis: Top entries seed their optimiser from a prior-best solution (their own or a sibling task's) rather than starting
    from a random or hand-tuned baseline.  Cuts the path-length to a high score significantly.
  successful_mutations:
  - kind: add_initialization_seed
    description: seeded optimizer from a prior-best solution
    target_identifier: null
    score_delta: null
    schema_version: '2.0'
  failed_mutations: []
  expected_verifier_signal: first valid score is already close to the search ceiling; subsequent iterations refine rather
    than discover.
  contraindications:
  - never embed *concrete* gain values from another task verbatim — that turns the pattern into a leaderboard cheat sheet
    (see plan §3.5).
  - the seed must come from a previous run on the *same* task; cross-task seeding is much less reliable.
