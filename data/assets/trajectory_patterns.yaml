- id: candidate_zero_integral_gain_on_saturation
  task_family: robotics_optimization
  failure_id: failure_pid_integrator_windup
  diagnosis: When an actuator output is at saturation, allowing the integral term to keep accumulating produces windup.  Successful
    PID-tuning runs disable the integral channel entirely for axes where the actuator is regularly saturated.
  successful_mutations:
  - kind: set_parameter_zero
    description: set parameter to zero on Ki_theta
    target_identifier: Ki_theta
    score_delta: null
    schema_version: '2.0'
  - kind: set_parameter_zero
    description: set parameter to zero on Ki_x
    target_identifier: Ki_x
    score_delta: null
    schema_version: '2.0'
  - kind: set_parameter_zero
    description: set parameter to zero on Ki_z
    target_identifier: Ki_z
    score_delta: null
    schema_version: '2.0'
  failed_mutations: []
  expected_verifier_signal: feasibility stays valid, overshoot decreases, settling time after setpoint changes goes down.
  contraindications:
  - do not raise Ki to compensate — the integrator will wind up again on the next saturation event
  evidence_count: 9
