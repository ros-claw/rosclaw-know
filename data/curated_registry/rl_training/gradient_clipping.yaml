body:
  symptom: NaN/Inf in loss or weights after a step explodes the gradient
  diagnosis: 'The root cause is captured by the ''gradient_clipping'' fix family: numerical
    instability.'
  fix: Apply `torch.nn.utils.clip_grad_norm_(model.parameters(), max_norm=1.0)` before `optimizer.step()`.
    If NaN still appears, halve the learning rate and verify the loss does not feed `log(<=0)`
    or divide by zero.
  anti_pattern: Catching the NaN after it surfaces and zeroing it out — the bad direction
    has already corrupted the optimizer's moment buffers (Adam's m and v). Restart training
    instead of patching.
  expected_signal: The agent response names the canonical fix, avoids the anti-pattern, and
    remains valid across the task's rubric.
  before_code: 'loss.backward()

    optimizer.step()                # no clipping

    '
  after_code: 'loss.backward()

    torch.nn.utils.clip_grad_norm_(model.parameters(), max_norm=1.0)

    optimizer.step()

    '
  cross_domain_hints:
  - source_domain: Control_Locomotion
    insight: Gradient clipping is the SGD analogue of an output limiter on a controller —
      bound the magnitude of every actuation.
    action_suggestion: 'Set `max_norm` analogous to `tau_max`: derived from a physical/training-stability
      limit, not guessed.'
