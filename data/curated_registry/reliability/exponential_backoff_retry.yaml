body:
  symptom: Network, RPC, microservice, and HTTP API call timeout cascades cause thundering-herd
    request storms and exponential-retry amplification after partial upstream service degradation,
    backend unavailability, or transient HTTP 5xx errors; naive fixed-delay retry loops without
    jitter or exponential backoff compound the cascading load, overwhelm downstream capacity,
    and prolong the outage duration
  diagnosis: 'The root cause is captured by the ''exponential_backoff_retry'' fix family:
    communication timeout.'
  fix: Wrap network calls with exponential backoff (base 0.5 s, factor 2, jitter ±30 %), cap
    retries at 5, and add a circuit-breaker that opens when error rate > 50 % over the last
    20 calls.
  anti_pattern: 'Tight `while True: retry()` loops — these turn a transient blip into a thundering
    herd.'
  expected_signal: The agent response names the canonical fix, avoids the anti-pattern, and
    remains valid across the task's rubric.
  before_code: "while True:\n    try:\n        return rpc.call()\n    except Timeout:\n  \
    \      continue                    # tight retry\n"
  after_code: "for attempt in range(MAX_ATTEMPTS):\n    try:\n        return rpc.call()\n\
    \    except Timeout:\n        delay = BASE * (2 ** attempt) * random.uniform(0.7, 1.3)\n\
    \        time.sleep(min(delay, MAX_BACKOFF))\nraise RpcUnreachable()\n"
  cross_domain_hints:
  - source_domain: Control_Locomotion
    insight: 'Same idea as PID gain scheduling: tighten effort when the system responds, back
      off when it stalls.'
    action_suggestion: Lower the retry rate when failure rate climbs, just as a controller
      lowers gain in unstable regions.
