body:
  symptom: Model-predictive control (MPC) and receding-horizon planning drift away from ground
    truth when the internal dynamics model mismatches real-world friction, terrain, or disturbance;
    the predicted state diverges from the measured state over the planning horizon, causing
    unbounded tracking error unless the plan is replanned in closed loop with online state
    feedback and shorter replan intervals
  diagnosis: 'The root cause is captured by the ''closed_loop_replanning'' fix family: oscillation
    divergence.'
  fix: 'Replace the open-loop planner with a Model-Predictive Control loop: re-solve a horizon-H
    optimization every dt using the latest measurement, execute only the first action, then
    re-solve. Keep dt ≤ system latency.'
  anti_pattern: Compensating for tracking error by adding feed-forward terms tuned offline
    — the offline tuning never anticipates the actual disturbance profile.
  expected_signal: The agent response names the canonical fix, avoids the anti-pattern, and
    remains valid across the task's rubric.
  before_code: "plan = solve_once(initial_state)   # open loop\nfor u in plan:\n    execute(u)\n"
  after_code: "while not done:\n    state = sense()                # close the loop\n    plan\
    \  = solve_horizon(state, H)\n    execute(plan[0])               # discard the rest, re-solve\n"
  cross_domain_hints:
  - source_domain: Learning_Training
    insight: 'Same closed-loop principle as supervised → RL fine-tuning: don''t trust your
      offline model, re-measure under the deployment distribution.'
    action_suggestion: Treat each MPC step as a one-step on-policy correction, the way RL
      fine-tuning corrects a supervised base.
