body:
  symptom: PID integral wind-up drives the actuator (torque, force, valve position, or flow
    rate) into prolonged saturation; after the demand transient ends, the integrator retains
    accumulated state and the controller takes a settling time to release it, causing overshoot
    past target as the actuator slowly retracts from saturation
  diagnosis: 'The root cause is captured by the ''anti_windup_pid'' fix family: torque overflow.'
  fix: 'Apply conditional integration: stop accumulating the integral term whenever the actuator
    output is saturated AND the error direction would push further into saturation. Clamp
    `tau_cmd` with `torch.clamp(tau, -tau_max, tau_max)`.'
  anti_pattern: Cranking up Kp/Ki to fix a tracking error during saturation — this only deepens
    the wind-up and amplifies the eventual oscillation when the load reverses direction.
  expected_signal: The agent response names the canonical fix, avoids the anti-pattern, and
    remains valid across the task's rubric.
  before_code: "def pid_step(err, dt):\n    integ += err * dt           # unconditional integration\n\
    \    tau = Kp*err + Ki*integ + Kd*derr\n    return tau                  # no output limiter\n"
  after_code: "def pid_step(err, dt):\n    tau_uncl = Kp*err + Ki*integ + Kd*derr\n    tau\
    \ = torch.clamp(tau_uncl, -tau_max, tau_max)\n    saturated = tau != tau_uncl\n    if\
    \ not (saturated and same_sign(err, tau_uncl)):\n        integ += err * dt        # conditional\
    \ integration\n    return tau\n"
  cross_domain_hints:
  - source_domain: Systems_Compute
    insight: 'Same back-pressure principle as bounded-queue producer-consumer: stop the producer
      when downstream is full.'
    action_suggestion: Treat actuator saturation as a back-pressure signal and pause the integrator
      the way you'd pause a queue writer.
  - source_domain: Learning_Training
    insight: Clamp gradient analogue — gradient clipping prevents one outlier from blowing
      up a step, just as anti-windup prevents one saturated cycle from poisoning the next.
    action_suggestion: 'Reuse the `clip_grad_norm_` mental model: an upper bound that fires
      only when the magnitude exceeds a known physical limit.'
