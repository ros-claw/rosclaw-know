body:
  symptom: Commanded actuator output (force, torque, peak velocity, or position) overshoots
    the actuator's rated peak or diverges to ±∞ when the controller has no command-side saturation
    clamp; the command signal briefly exceeds rated limits before mechanical end-stops or
    safety interlocks (safety relays) trip
  diagnosis: 'The root cause is captured by the ''output_saturation_clamp'' fix family: velocity
    divergence.'
  fix: Wrap every commanded velocity through `torch.clamp(v_cmd, -v_max, v_max)` where `v_max`
    is read from the platform's robot_specifications YAML. Add an integral-leak term (`integ
    *= 0.99` per step) when in steady state.
  anti_pattern: Adding only a soft-start ramp on the user-side command — once internal feedback
    diverges, the ramp can't stop the integrator alone.
  expected_signal: The agent response names the canonical fix, avoids the anti-pattern, and
    remains valid across the task's rubric.
  before_code: 'v_cmd = pid_step(error, dt)     # unbounded output

    '
  after_code: 'v_cmd_raw = pid_step(error, dt)

    v_cmd = torch.clamp(v_cmd_raw, -V_MAX, V_MAX)

    '
  cross_domain_hints:
  - source_domain: Memory_Reasoning
    insight: 'Same as the sliding-window KV-cache: cap the magnitude of the running state,
      not just the input.'
    action_suggestion: Bound the integrator state itself (`integ = clamp(integ, -I_MAX, I_MAX)`),
      mirroring the KV sliding window.
