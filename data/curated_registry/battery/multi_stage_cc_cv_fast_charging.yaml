body:
  symptom: Aggressive constant-current fast-charging accelerates capacity fade via lithium
    plating at high SOC on graphite or silicon anodes
  diagnosis: 'The root cause is captured by the ''multi_stage_cc_cv_fast_charging'' fix family:
    battery capacity fade.'
  fix: 'Replace single-stage CC charging with a multi-stage protocol: keep constant current
    only below ~70 % SOC, then taper current as a function of SOC (e.g. I(SOC) = I_max * (1
    - SOC)^0.5) before switching to constant-voltage hold. Add a temperature-aware current
    limiter that derates above 35 °C anode-surface temperature. Pulse-charging with short
    rest intervals also relieves lithium concentration gradients near the anode.'
  anti_pattern: Holding the same 4C constant-current target through the whole 10→80 % SOC
    window — once SOC > 70 % the anode-side overpotential drops below 0 V vs. Li/Li+ and metallic
    lithium plates onto the graphite surface, irreversibly consuming cyclable lithium.
  expected_signal: The agent response names the canonical fix, avoids the anti-pattern, and
    remains valid across the task's rubric.
  before_code: "def fast_charge(cell, target_soc=0.80):\n    while cell.soc < target_soc:\n\
    \        cell.apply_current(4 * cell.capacity_Ah)  # 4C flat\n        cell.step(dt=1.0)\n"
  after_code: "def fast_charge(cell, target_soc=0.80, taper_above_soc=0.70):\n    while cell.soc\
    \ < target_soc:\n        if cell.surface_temp_C > 35.0:\n            i_lim = 1.0 * cell.capacity_Ah\
    \                  # thermal derate\n        elif cell.soc < taper_above_soc:\n      \
    \      i_lim = 4.0 * cell.capacity_Ah                  # CC stage\n        else:\n   \
    \         # SOC-dependent taper toward CV hold\n            i_lim = 4.0 * cell.capacity_Ah\
    \ * (1 - cell.soc) ** 0.5\n        cell.apply_current(i_lim)\n        cell.step(dt=1.0)\n"
  cross_domain_hints:
  - source_domain: Control_Locomotion
    insight: 'Same shape as gain-scheduled PID: full gain near the operating point, taper
      as you approach the saturation boundary.'
    action_suggestion: Derate the control effort (charging current) as the state (SOC) approaches
      the unsafe regime where plating dominates.
