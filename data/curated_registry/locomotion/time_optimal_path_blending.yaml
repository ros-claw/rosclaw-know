body:
  symptom: Joint-space trajectories that decelerate to zero at every via-point inflate cycle
    time by 40-60 % even when via-points are colinear
  diagnosis: 'The root cause is captured by the ''time_optimal_path_blending'' fix family:
    robot cycle time inflation.'
  fix: Use Time-Optimal Path Parameterization (TOPP-RA or equivalent) over the full multi-via-point
    path so the velocity profile is computed against joint torque/velocity/acceleration limits
    globally, not per-segment. For colinear via-points let the blender preserve a non-zero
    pass velocity (blend_radius > 0). Where TOPP is unavailable, fall back to jerk-limited
    S-curve profiles per segment with explicit blend-velocity continuity at via-points — the
    arm never stops at intermediate poses.
  anti_pattern: Calling MoveIt's joint_trajectory_controller with each via-point as a separate
    goal — the controller decelerates to zero at every intermediate pose because each goal
    is a stop-condition, even though the geometric path could be traversed at constant speed.
  expected_signal: The agent response names the canonical fix, avoids the anti-pattern, and
    remains valid across the task's rubric.
  before_code: "for via in via_points:\n    # each call decelerates to zero at `via` — wastes\
    \ 60% of cycle\n    arm.move_to(via, velocity_scale=1.0)\n"
  after_code: "from toppra import TOPPRA\n# Compute a single time-optimal velocity profile\
    \ across ALL via-points,\n# preserving non-zero pass velocity at colinear segments.\n\
    profile = TOPPRA(\n    path=via_points,\n    vlim=arm.joint_velocity_limits,\n    alim=arm.joint_acceleration_limits,\n\
    \    blend_radius=0.05,                  # meters of blend overlap\n).compute_trajectory()\n\
    arm.follow_trajectory(profile)         # never stops mid-path\n"
  cross_domain_hints:
  - source_domain: Planning_Decision
    insight: Solving each via-point in isolation is the same anti-pattern as greedy local
      search on a global schedule — the local optimum (full deceleration at each goal) is
      far from the global one (constant speed through colinear segments).
    action_suggestion: Plan the velocity profile over the FULL multi-via-point path, not segment-by-segment.
      Hand the planner the joint-level kinematic limits, not just the geometric waypoints.
