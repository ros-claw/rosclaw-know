body:
  symptom: Transformer self-attention layer materializes the full NxN matrix in HBM at long
    context length, causing CUDA OOM and HBM-bandwidth-bound (not compute-bound) inference
    throughput
  diagnosis: 'The root cause is captured by the ''flash_attention_tiled_softmax'' fix family:
    memory exhaustion.'
  fix: 'Adopt FlashAttention-style TILED ONLINE-SOFTMAX attention: split Q and K/V into blocks
    that fit in SRAM, compute partial softmax incrementally with rescaling, and never materialize
    the full attention matrix in HBM. As a SECONDARY win, the SRAM-resident softmax becomes
    compute-bound (good for arithmetic intensity). Fallback when tiled attention is unavailable:
    SLIDING-WINDOW attention or circular-buffer KV-cache truncation to cap the effective sequence
    length seen by the softmax.'
  anti_pattern: 'Casting QK to fp16 to halve memory — saves only 2x and degrades accuracy;
    the real problem is the N^2 materialization, not precision. Also: bumping GPU memory limit
    is a non-fix that just delays the OOM.'
  expected_signal: The agent response names the canonical fix, avoids the anti-pattern, and
    remains valid across the task's rubric.
  before_code: "def attention(Q, K, V):\n    scores = Q @ K.transpose(-2,-1) / sqrt(dim) \
    \ # NxN materialized\n    return softmax(scores) @ V  # OOM at large N\n"
  after_code: "def flash_attention(Q, K, V, block_size=128):\n    out = zeros_like(V)\n  \
    \  for j in range(0, K.shape[-2], block_size):\n        Kj = K[..., j:j+block_size, :]\n\
    \        Vj = V[..., j:j+block_size, :]\n        out = online_softmax_update(out, Q, Kj,\
    \ Vj)\n    return out\n"
  cross_domain_hints:
  - source_domain: Memory_Reasoning
    insight: 'Online softmax is mathematically a streaming reduction: maintain (max, sum)
      statistics and rescale partials. Same pattern as streaming variance (Welford''s algorithm).'
    action_suggestion: Treat the softmax denominator as a running statistic updated incrementally
      rather than recomputed.
  - source_domain: Systems_Compute
    insight: HBM-bandwidth-bound becomes compute-bound when working set fits in SRAM. Same
      trade-off as cache-blocking in dense linear algebra.
    action_suggestion: Size block_size to match L2/SRAM capacity divided by matrix-element
      bytes.
